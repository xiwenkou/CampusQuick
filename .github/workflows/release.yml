name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Verify rules & presets
        run: |
          python rules/scripts/build_rules.py --check
          python -m unittest discover -s rules/tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore (if configured in Secrets)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/campusquick-release.jks
            echo "RELEASE_KEYSTORE_FILE=/tmp/campusquick-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests & assemble Release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p release_out
          APK_NAME="CampusQuick-${GITHUB_REF_NAME}-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release_out/${APK_NAME}"
          cp rules/dist/tmall_campus_clash_rules.yaml release_out/
          cp rules/dist/tmall_campus_clash_provider.yaml release_out/
          cp rules/dist/tmall_campus_override.js release_out/
          cp rules/dist/tmall_campus_singbox.json release_out/
          (cd release_out && sha256sum * > SHA256SUMS.txt)
          cat release_out/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: false
          files: release_out/*
