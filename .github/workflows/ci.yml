name: CampusQuick CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rules-and-presets:
    name: Validate Rules & Presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Verify generated rule artifacts are up to date
        run: python rules/scripts/build_rules.py --check
      - name: Run rule safety & preset schema unit tests
        run: python -m unittest discover -s rules/tests -v

  android-build-and-test:
    name: Android Unit Tests & APK Build
    needs: rules-and-presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build Debug & Release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: campusquick-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
